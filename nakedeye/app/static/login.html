<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#080810"/>
<title>NakedEye Login</title>
<link rel="manifest" href="/manifest.json"/>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<style>
  :root { --bg:#080810; --panel:#0e0e1a; --muted:#9090a8; --text:#e8e8f0; --line:rgba(124,58,237,.22); --accent:#8fbfa0; --purple:#7c3aed; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family:Arial,sans-serif; padding:20px; }
  body::before { content:""; position:fixed; inset:0; background-image:linear-gradient(rgba(124,58,237,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(124,58,237,.04) 1px,transparent 1px); background-size:40px 40px; pointer-events:none; }
  .card { width:min(420px,100%); background:rgba(14,14,26,.92); border:1px solid var(--line); border-radius:18px; padding:28px; position:relative; box-shadow:0 24px 80px rgba(0,0,0,.45); }
  .eye { width:38px; height:38px; border:1.5px solid var(--accent); border-radius:50%; display:grid; place-items:center; margin-bottom:16px; }
  .eye::after { content:""; width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 10px var(--accent); }
  h1 { margin:0; font-size:24px; letter-spacing:.08em; text-transform:uppercase; }
  h1 span { color:var(--accent); }
  p { color:var(--muted); margin:8px 0 22px; font-size:13px; line-height:1.5; }
  label { display:block; color:#606078; font-size:11px; letter-spacing:.14em; text-transform:uppercase; margin:14px 0 7px; }
  input { width:100%; border:1px solid var(--line); border-radius:10px; background:#14141f; color:var(--text); padding:12px 14px; font-size:15px; outline:none; }
  input:focus { border-color:var(--purple); box-shadow:0 0 0 3px rgba(124,58,237,.15); }
  button { width:100%; margin-top:20px; border:0; border-radius:10px; background:linear-gradient(135deg,var(--purple),#5b21b6); color:white; padding:12px 16px; font-weight:700; cursor:pointer; }
  .error, .locked { display:none; margin-top:14px; color:#f87171; font-size:13px; }
  body.has-error .error { display:block; }
  body.has-locked .locked { display:block; }
  .status-link { display:block; color:var(--accent); text-decoration:none; margin-top:16px; font-size:13px; text-align:center; }
</style>
</head>
<body>
<form class="card" method="post" action="/login">
  <div class="eye"></div>
  <h1>Naked<span>Eye</span></h1>
  <p>Private dashboard access. Public status remains available separately.</p>
  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" required autofocus/>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required/>
  <button type="submit">Login</button>
  <div class="error">Invalid username or password.</div>
  <div class="locked">Too many failed attempts. Try again later.</div>
  <a class="status-link" href="/status">View public status page</a>
</form>
<script>
  const params = new URLSearchParams(location.search);
  if (params.has('error')) document.body.classList.add('has-error');
  if (params.has('locked')) document.body.classList.add('has-locked');
</script>
</body>
</html>
